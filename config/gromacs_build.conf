# GROMACS build settings for tljh-install-gromacs (scripts/install_gromacs.sh).
# Bash syntax: KEY="value". tljh_server_setup.sh installs this file, with
# gromacs_cache.cmake, into /usr/local/etc/tljh/.
#
# To upgrade GROMACS: change GMX_VERSION and both MD5 values (from
# https://manual.gromacs.org/current/download.html), then run
#   sudo tljh-install-gromacs
# The new version installs next to the old one; /opt/gromacs/current then
# points to it.

# --- GROMACS release ------------------------------------------------------------
GMX_VERSION="2026.4"
GMX_URL="https://ftp.gromacs.org/gromacs/gromacs-${GMX_VERSION}.tar.gz"
GMX_MD5="fbe7d5071dee17e3f448502b1fd30d55"
# Regression tests, run by `make check` before installing.
REGRESSIONTEST_URL="https://ftp.gromacs.org/regressiontests/regressiontests-${GMX_VERSION}.tar.gz"
REGRESSIONTEST_MD5="7098c9e520c3ba3654a7bb5cc4e8adf5"

# --- Where it goes ----------------------------------------------------------------
GMX_ROOT="/opt/gromacs"                  # versions go in $GMX_ROOT/<version>
                                          # $GMX_ROOT/current links to the active one
BUILD_ROOT="/var/tmp/tljh-gromacs-build"  # deleted after a successful install

# --- Build options ------------------------------------------------------------------
# GROMACS's CMake options (GPU, SIMD, FFT, ...) live in this file:
CMAKE_CACHE_FILE="gromacs_cache.cmake"    # relative to this file's folder

# --- CUDA (for the RTX 4000 Ada) ------------------------------------------------------
# The NVIDIA driver must already be installed (nvidia-smi must work). If nvcc
# is missing, the CUDA toolkit is installed from NVIDIA's apt repository.
CUDA_VERSION="13.4"                       # toolkit in /usr/local/cuda-13.4
CUDA_REPO_DISTRO="ubuntu2604"
CUDA_KEYRING_URL="https://developer.download.nvidia.com/compute/cuda/repos/${CUDA_REPO_DISTRO}/x86_64/cuda-keyring_1.1-1_all.deb"
CUDA_HOME="/usr/local/cuda-${CUDA_VERSION}"
CUDA_APT_PACKAGE="cuda-toolkit-${CUDA_VERSION//./-}"   # cuda-toolkit-13-4

# --- Python API (gmxapi) ----------------------------------------------------------------
# gmxapi is built from this GROMACS release's source (python_packaging/gmxapi)
# into this course kernel's conda env. Empty = skip. If that env is rebuilt
# (tljh-install-kernel --recreate), re-add it with:
#   sudo tljh-install-gromacs --gmxapi-only
GMXAPI_ENV="compchem"                     # /opt/tljh/user/envs/compchem
