name: pchem2
channels:
  - conda-forge
  - nodefaults
dependencies:
  - pip
  - python>=3.14,<3.15
  - ipykernel>=7.2,<8
  - anywidget>=0.11
  # base scientific python stack
  - numpy>=2.5,<3
  - scipy>=1.18,<2
  - matplotlib>=3.11,<4
  - pandas>=3.0.5,<4
  - xarray>=2026.1
  # chemistry-specific stack
  - psi4>=1.11,<1.12
  - py3dmol>=2.5.1,<3
  - nglview>=4.0.1,<5
  - cclib>=1.8,<2
  # extra plotting libraries
  - altair>=6.2.2,<7
  - seaborn>=0.13
  # extra I/O tools
  - openpyxl>=3.1.5,<4
  - tabulate>=0.10.0
  - tqdm>=4.65,<5

  - pip:
    - nmrglue
    - git+https://github.com/mskblackbelt/ir_visuals_widget.git@v1.1.0
